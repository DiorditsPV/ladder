# /etc/nginx/sites-available/ladder.paveldiordits.site — фронт-дверь сервиса «Интервью».
# Всё проксируется на uvicorn (фронт отдаёт само приложение через StaticFiles), /var/www не нужен.
# Блок 443 и редирект с 80 дописывает certbot:  certbot --nginx -d ladder.paveldiordits.site --redirect
server {
    listen 80;
    listen [::]:80;
    server_name ladder.paveldiordits.site;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SSE — живое обновление оценок в сессии: без буферизации, с долгим таймаутом,
    # иначе nginx копит поток и обновления во второй вкладке залипают.
    location ~ ^/api/sessions/[0-9]+/events$ {
        proxy_pass         http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass         http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
