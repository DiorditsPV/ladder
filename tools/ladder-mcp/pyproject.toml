[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladder-mcp"
version = "0.1.0"
description = "MCP server for Ladder: edit directions, their columns and levels, topics and question cards via the Ladder API"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3", "httpx>=0.27"]

[project.scripts]
ladder-mcp = "ladder_mcp.server:main"

[tool.setuptools]
packages = ["ladder_mcp"]
