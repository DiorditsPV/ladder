name: Deploy (dev)

# Разворачивает dev-версию на том же сервере (тот же IP и те же SSH-секреты),
# но в изолированное окружение на отдельном порту 8801 (prod — 8800).
# Триггеры: push в ветку dev или ручной запуск.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# Свой concurrency-группа, чтобы dev-деплои не мешали prod и друг другу.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync sources to server (dev staging)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/.venv' \
            --exclude '__pycache__' \
            --exclude '*.db' \
            --exclude '.deploy' \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:~/interview-src-dev/"

      - name: Bootstrap & restart on server (dev)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "${PORT}" "${SSH_USER}@${SSH_HOST}" \
            'sudo bash ~/interview-src-dev/deploy/bootstrap.sh ~/interview-src-dev dev'
