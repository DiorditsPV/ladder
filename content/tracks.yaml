# Направления интервью (треки/роли) — профили-охваты над таксономией block/subblock.
# Нода входит в трек, если include ПУСТ, либо её `block`, либо `"block/subblock"` есть в include.
# Это профили над общим банком (без отдельного поля у нод) — работают на текущем контенте.
tracks:
  - id: data-engineer
    label: Дата-инженер
    include: []                       # пусто = весь банк (дефолт)
  - id: backend
    label: Бэкенд-разработчик
    include: [python, platform, databases/sql, databases/dbms, databases/storage, frameworks/airflow]
  - id: analyst
    label: Аналитик
    include: [databases/sql, databases/dbms, python, platform]
